name: release

# Run from the Actions tab and pick what kind of release this is. The next version comes
# from the latest vX.Y.Z tag, following Semantic Versioning:
#
#   patch  fixes only                        v1.4.2 -> v1.4.3
#   minor  new features, nothing breaks       v1.4.2 -> v1.5.0
#   major  something breaks for existing users v1.4.2 -> v2.0.0
#
# It builds and pushes the Docker image, then publishes the GitHub Release with notes from
# the merged pull requests and a ready-to-run archive (dependencies and frontend included).
#
# Each platform builds natively on its own runner (no QEMU emulation), pushes its image by
# digest, and the release job joins them under the version tags. Build layers are cached in
# the registry (`:buildcache-<arch>`), which doesn't expire like the Actions cache does.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Kind of release
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      image: ${{ steps.version.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Work out the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          IFS=. read -r major minor patch <<< "${latest#v}"
          major=${major:-0} minor=${minor:-0} patch=${patch:-0}

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          version="$major.$minor.$patch"
          echo "Releasing v$version (previous: ${latest:-none})"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"

          # Image names must be lowercase, and owner names on GitHub may not be.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.version.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest only: the release job tags the joined image once both platforms built.
      - name: Build and push the ${{ matrix.arch }} image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max

      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.version.outputs.image }}
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.major != '0' }}
            type=raw,value=latest

      - name: Push the multi-platform image
        working-directory: digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"

          for digest in *; do
            args+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Build the archive
        run: |
          container=$(docker create --platform linux/amd64 "$IMAGE:$VERSION")
          docker cp "$container:/app" "kitedesk-$VERSION"
          docker rm "$container"

          # The image links public/storage to its own path. Installs run storage:link.
          rm -f "kitedesk-$VERSION/public/storage"

          tar -czf "kitedesk-$VERSION.tar.gz" "kitedesk-$VERSION"
          sha256sum "kitedesk-$VERSION.tar.gz" > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            --notes "Docker image: \`docker pull $IMAGE:$VERSION\`" \
            "kitedesk-$VERSION.tar.gz" SHA256SUMS
